<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Expense</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Django ko form lai thikka ko size banauna */
        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>
<body class="bg-light">

    <div class="container mt-5" style="max-width: 500px;">
        
        <div class="card shadow-sm">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">💸 Add New Expense</h4>
            </div>
            
            <div class="card-body p-4">
                <form action="" method="post" novalidate>
                    {% csrf_token %}
                    
                    {{ form.as_p }}
                    
                    <div class="mt-4">
                        <button type="submit" class="btn btn-success w-100 mb-2">Save Expense</button>
                        <a href="{% url 'expense_list' %}" class="btn btn-outline-secondary w-100">Cancel</a>
                    </div>
                </form>
            </div>
        </div>

    </div>

</body>
</html>
