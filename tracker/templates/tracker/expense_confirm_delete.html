<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Expense</title>
    <!-- Bootstrap Link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<!-- Screen ko thakkai bich (center) ma dekhauna d-flex use garieko -->
<body class="bg-light d-flex justify-content-center align-items-center" style="height: 100vh;">

    <div class="card shadow p-4 text-center" style="max-width: 400px;">
        
        <h3 class="text-danger mb-3">⚠️ Are you sure?</h3>
        
        <p class="fs-5">
            Do you really want to delete <br> 
            <strong>"{{ item.title }}"</strong> <span class="badge bg-danger">${{ item.amount }}</span> ?
        </p>
        
        <form method="post" class="mt-4">
            {% csrf_token %}
            <a href="{% url 'expense_list' %}" class="btn btn-secondary me-2">Cancel</a>
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
        </form>
    </div>

</body>
</html>
