<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Task</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center" style="min-height: 100vh;">

    <div class="card shadow p-4 text-center" style="width: 420px;">
        <h3 class="text-danger mb-3">🗑️ Delete Task</h3>
        <p class="fs-5">Are you sure you want to delete <strong>"{{ item.title }}"</strong>?</p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger w-100 mb-2">Yes, Delete</button>
        </form>

        <a href="{% url 'task_list' %}" class="btn btn-outline-secondary w-100">Cancel</a>
    </div>

</body>
</html>
