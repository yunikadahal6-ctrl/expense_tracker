<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add / Edit Task</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center" style="min-height: 100vh;">

    <div class="card shadow p-4" style="width: 420px;">
        <h3 class="text-center text-warning fw-bold mb-4">✅ Add / Edit Task</h3>

        <form method="post" novalidate>
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-warning w-100 fw-semibold mt-2">Save Task</button>
        </form>

        <a href="{% url 'task_list' %}" class="btn btn-outline-secondary w-100 mt-2">Cancel</a>
    </div>

</body>
</html>
