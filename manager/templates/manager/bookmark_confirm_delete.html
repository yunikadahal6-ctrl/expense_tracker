<!DOCTYPE html>
<html lang="en">
<head>
    <title>Delete Bookmark</title>
    <!-- Bootstrap Link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<!-- d-flex, justify-content-center, align-items-center le purai box lai bich ma lyauncha -->
<body class="bg-light d-flex justify-content-center align-items-center" style="height: 100vh;">

    <!-- card ra shadow le ramro box banayo -->
    <div class="card shadow p-4 text-center" style="max-width: 400px;">
        
        <!-- text-danger le text lai rato banayo -->
        <h3 class="text-danger">⚠️ Are you sure?</h3>
        
        <p class="mt-3">Do you really want to delete <br> <strong>"{{ item.title }}"</strong>?</p>
        
        <form method="post" class="mt-4">
            {% csrf_token %}
            <!-- btn-secondary le gray ra btn-danger le red button banayo -->
            <a href="{% url 'bookmark_list' %}" class="btn btn-secondary me-2">Cancel</a>
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
        </form>
    </div>

</body>
</html>
