<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookmarks</title>
    
    <!-- YO HO BOOTSTRAP KO MAGIC LINK -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Container le purai page lai thikka ko width ma rakhcha -->
    <div class="container mt-5">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="text-primary">🔖 My Bookmarks</h1>
            <!-- btn btn-primary le yeslai blue button banauncha -->
            <a href="{% url 'bookmark_create' %}" class="btn btn-primary">+ Add New Bookmark</a>
        </div>

        <!-- Search ra Filter lai euta ramro Box (Card) vitra haleko -->
        <div class="card shadow-sm mb-4">
            <div class="card-body d-flex justify-content-between align-items-center">
                
                <form method="get" class="d-flex">
                    <input type="text" name="q" class="form-control me-2" placeholder="Search by title...">
                    <button type="submit" class="btn btn-outline-success">Search</button>
                </form>

                <div>
                    <strong>Filter: </strong>
                    <a href="{% url 'bookmark_list' %}" class="badge bg-secondary text-decoration-none">All</a>
                    <a href="?category=work" class="badge bg-info text-decoration-none">Work</a>
                    <a href="?category=study" class="badge bg-warning text-dark text-decoration-none">Study</a>
                    <a href="?category=entertainment" class="badge bg-danger text-decoration-none">Entertainment</a>
                </div>

            </div>
        </div>

        <!-- Bookmark haru ko ramro list -->
        <ul class="list-group shadow-sm">
            {% for item in items %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <div>
                        <a href="{{ item.url }}" target="_blank" class="text-decoration-none fw-bold text-dark fs-5">
                            {{ item.title }}
                        </a>
                        <span class="text-muted ms-2">({{ item.get_category_display }})</span>
                    </div>
                    
                    <!-- Edit (Pahelo) ra Delete (Rato) buttons -->
                    <div>
                        <a href="{% url 'bookmark_update' item.pk %}" class="btn btn-sm btn-warning">Edit</a>
                        <a href="{% url 'bookmark_delete' item.pk %}" class="btn btn-sm btn-danger">Delete</a>
                    </div>
                </li>
            {% empty %}
                <li class="list-group-item text-center text-muted py-4">
                    No bookmarks found! Add some links.
                </li>
            {% endfor %}
        </ul>

    </div>

</body>
</html>
